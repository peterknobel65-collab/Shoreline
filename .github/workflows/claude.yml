# Claude on GitHub (optional)
#
# Lets you ask Claude to do work right from GitHub: write "@claude" plus a
# request in an issue or a pull request comment, e.g.
#   "@claude please add a contact page"
# Claude works on a "claude/..." branch, and the "Auto PR and Merge"
# workflow then opens and merges a pull request for it.
#
# Needs a one-time setup (see README.md): a secret named
# CLAUDE_CODE_OAUTH_TOKEN or ANTHROPIC_API_KEY.
#
# For safety, only the repository OWNER can trigger Claude, so strangers
# can't get code merged into your project.

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && github.event.issue.author_association == 'OWNER' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
